<header class="sticky top-0 z-30 border-b border-slate-200 bg-white/85 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6">
    <a routerLink="/" class="flex items-center gap-2.5">
      <span
        class="grid size-9 place-items-center rounded-lg bg-gradient-to-br from-red-500 via-fuchsia-600 to-violet-600 text-lg font-extrabold text-white shadow-sm"
        >A</span
      >
      <span class="text-base font-bold tracking-tight text-slate-900 sm:text-lg">{{ title }}</span>
    </a>
    <nav class="flex items-center gap-1 text-sm font-medium">
      <a
        routerLink="/"
        routerLinkActive="bg-slate-100 text-slate-900"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-md px-3 py-2 text-slate-600 hover:text-slate-900"
        >Home</a
      >
      <a
        [routerLink]="['/learn', firstTopicId]"
        routerLinkActive="bg-slate-100 text-slate-900"
        class="rounded-md px-3 py-2 text-slate-600 hover:text-slate-900"
        >Lessons</a
      >
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>
